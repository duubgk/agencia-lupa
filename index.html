<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agência Lupa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Mesa de detetive à noite: fundo azul-tinta, documentos em papel frio,
     carimbo vermelho para decisões, etiqueta amarela para provas. Uma coluna, feita para celular. */
  color-scheme: dark;
  --ink:#0f1629;
  --ink-2:#18213b;
  --ink-3:#222e52;
  --line:#33416d;
  --text:#e8ecf7;
  --muted:#9ba7c9;
  --paper:#e9ece3;
  --paper-2:#d5dacb;
  --paper-ink:#1c2135;
  --stamp:#e5483d;
  --marker:#f3c62f;
  --ok:#59c98b;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-hand:"Kalam","Comic Sans MS",cursive;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--marker);outline-offset:2px}
svg{max-width:100%;display:block}
h1,h2,h3{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.02em;line-height:1;margin:0;text-wrap:balance}
p{margin:0}
.wrap{max-width:680px;margin:0 auto;padding:0 16px 64px}

/* ---------- capa ---------- */
.hero{padding:28px 0 20px;border-bottom:2px solid var(--line);display:flex;flex-direction:column;gap:14px}
.hero .eyebrow{font-family:var(--f-mono);font-size:12px;color:var(--marker);letter-spacing:.14em;text-transform:uppercase}
.hero h1{font-size:clamp(54px,17vw,96px);font-weight:900;letter-spacing:-.01em}
.hero h1 span{color:var(--stamp)}
.hero p{color:var(--muted);max-width:56ch}
.rules{display:flex;flex-direction:column;gap:6px;margin:18px 0 6px;padding:0;list-style:none;font-size:14.5px;color:var(--text)}
.rules li{padding-left:18px;position:relative}
.rules li::before{content:"";position:absolute;left:0;top:.62em;width:9px;height:2px;background:var(--marker)}
.files{display:flex;flex-direction:column;gap:14px;margin-top:22px}
.file{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:stretch;text-align:left;background:var(--paper);color:var(--paper-ink);border:0;border-radius:3px;padding:0;position:relative;overflow:hidden;width:100%}
.file .num{background:var(--marker);font-family:var(--f-display);font-weight:900;font-size:44px;display:flex;align-items:center;justify-content:center;padding:0 12px;min-width:76px;color:#1c1a10}
.file .body{padding:14px 14px 14px 0;display:flex;flex-direction:column;gap:6px}
.file h2{font-size:28px;font-weight:900}
.file .meta{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:#4d566f;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.file p{font-size:14.5px;line-height:1.45}
.pips{display:inline-flex;gap:3px;vertical-align:middle}
.pips i{width:10px;height:10px;border:1.5px solid var(--paper-ink);border-radius:50%;display:block}
.pips i.on{background:var(--stamp);border-color:var(--stamp)}
.file .status{font-family:var(--f-display);font-weight:900;font-size:15px;letter-spacing:.08em;color:var(--stamp);border:2px solid var(--stamp);padding:2px 7px;border-radius:2px;transform:rotate(-4deg);position:absolute;right:10px;top:10px;background:rgba(233,236,227,.85)}
.foot{margin-top:28px;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--muted);text-decoration:underline;font-size:13px}

/* ---------- caso ---------- */
.top{position:sticky;top:0;z-index:5;background:var(--ink);border-bottom:1px solid var(--line);margin:0 -16px;padding:0 16px}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 0 8px}
.back{background:var(--ink-3);border:1px solid var(--line);border-radius:3px;padding:6px 10px;font-family:var(--f-mono);font-size:12px;white-space:nowrap}
.topbar h1{font-size:22px;font-weight:900;flex:1;min-width:0}
.topbar .tag{font-family:var(--f-mono);font-size:11px;color:var(--marker);white-space:nowrap}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 1 0;min-width:0;background:none;border:0;border-bottom:3px solid transparent;padding:9px 2px 8px;font-family:var(--f-display);font-weight:700;font-size:clamp(11.5px,3.3vw,16px);letter-spacing:0;overflow:hidden;text-transform:uppercase;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--stamp)}
.tab.accuse[aria-selected="true"]{color:var(--stamp)}
.panel{padding-top:20px;display:flex;flex-direction:column;gap:18px}
.lead{font-size:17px}
.story{display:flex;flex-direction:column;gap:12px;max-width:62ch}
.kicker{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--marker)}
.box{background:var(--ink-2);border:1px solid var(--line);border-radius:4px;padding:14px;display:flex;flex-direction:column;gap:10px}
.box h3{font-size:18px;font-weight:700;letter-spacing:.06em}
.facts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:15px}
.facts li{display:grid;grid-template-columns:auto 1fr;gap:10px}
.facts b{font-family:var(--f-mono);font-weight:600;font-size:13px;color:var(--marker);white-space:nowrap;padding-top:2px}

/* suspeitos */
.sus{background:var(--paper);color:var(--paper-ink);border-radius:3px;overflow:hidden;position:relative}
.sus .head{display:grid;grid-template-columns:104px 1fr;gap:12px;padding:12px 12px 0}
.sus .pic{border:2px solid var(--paper-ink);background:#c5cede}
.sus h3{font-size:25px;font-weight:900}
.sus .role{font-family:var(--f-mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:#4d566f;margin-top:4px}
.sus dl{margin:8px 0 0;font-size:14px;line-height:1.4;display:flex;flex-direction:column;gap:6px}
.sus dt{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#6a718a}
.sus dd{margin:0}
.sus blockquote{margin:12px;padding:10px 12px;background:#fff;border-left:4px solid var(--paper-ink);font-size:15px;line-height:1.5}
.sus blockquote::before{content:"Depoimento";display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#6a718a;margin-bottom:4px}
.sus .act{padding:0 12px 12px;display:flex;justify-content:flex-end}
.chip{background:none;border:1.5px solid var(--paper-ink);color:var(--paper-ink);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500}
.sus.off .head,.sus.off blockquote{opacity:.42}
.sus .head{padding-bottom:12px}
.mail{background:var(--paper);color:var(--paper-ink);border-radius:3px;padding:14px;display:flex;flex-direction:column;gap:10px;font-size:15px}
.mail header{display:flex;flex-direction:column;gap:2px;border-bottom:1.5px solid var(--paper-ink);padding-bottom:10px}
.mail header b{font-size:17px;line-height:1.25}
.mail header span{font-family:var(--f-mono);font-size:11.5px;color:#4d566f}
.mail .att{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-top:1px solid #b6bfd0;padding-top:10px}
.mail .att span{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#4d566f;width:100%}
.mail .att i{font-style:normal;font-size:12.5px;background:#fff;border:1px solid #b6bfd0;border-radius:3px;padding:2px 7px}
.mail .btn.ghost{border-color:var(--paper-ink);color:var(--paper-ink);align-self:flex-start}
.msg.del{font-style:italic;color:#8fa0cc}
.sus.off::after{content:"DESCARTADO";position:absolute;left:50%;top:74px;transform:translateX(-50%) rotate(-8deg);font-family:var(--f-display);font-weight:900;font-size:34px;letter-spacing:.08em;color:var(--stamp);border:3px solid var(--stamp);padding:0 10px;border-radius:3px;pointer-events:none;background:rgba(233,236,227,.7)}
.wit{background:var(--ink-2);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.wit b{font-family:var(--f-display);font-size:19px;letter-spacing:.04em;text-transform:uppercase}
.wit small{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.wit p{font-size:15px;margin-top:4px}

/* pistas */
.clue{background:var(--ink-2);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.clue .bar{display:flex;align-items:center;gap:10px;padding:10px 12px}
.evtag{background:var(--marker);color:#1c1a10;font-family:var(--f-display);font-weight:900;font-size:17px;padding:1px 8px;border-radius:2px;white-space:nowrap}
.clue h3{font-size:19px;font-weight:700;letter-spacing:.04em;flex:1}
.zoom{background:var(--ink-3);border:1px solid var(--line);border-radius:3px;padding:4px 9px;font-family:var(--f-mono);font-size:11.5px;white-space:nowrap}
.clue .art{background:#0a0f1d;padding:10px;cursor:zoom-in}
.clue .cap{padding:10px 12px 12px;font-size:14px;color:var(--muted)}
.art svg{width:100%;height:auto;border-radius:2px}
.t-mono{font-family:var(--f-mono)}
.t-hand{font-family:var(--f-hand)}
.t-disp{font-family:var(--f-display);font-weight:900}
.doc{border-radius:3px;padding:14px;font-size:13.5px;line-height:1.5;overflow-x:auto}
.doc.hand{background:var(--paper);color:#1d2a52;font-family:var(--f-hand);font-size:16px;line-height:1.55}
.doc.hand h4{margin:0 0 6px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:#4d566f;border-bottom:1.5px solid #4d566f;padding-bottom:5px}
.doc.hand table{border-collapse:collapse;width:100%}
.doc.hand td{padding:1px 8px 1px 0;border-bottom:1px solid #b6bfd0;vertical-align:top}
.doc.hand td:first-child{white-space:nowrap;font-weight:700}
.doc.hand table.wrap td:first-child{white-space:normal;width:38%}
.doc.hand .obs{margin-top:8px;font-size:15px}
.doc.term{background:#060a14;color:#bcd0f5;font-family:var(--f-mono);font-size:12px;border:1px solid #26335c}
.doc.term h4{margin:0 0 8px;font-size:11.5px;font-weight:600;color:var(--marker);letter-spacing:.06em}
.doc.term table{border-collapse:collapse;width:100%}
.doc.term td{padding:2px 8px 2px 0;vertical-align:top;font-variant-numeric:tabular-nums}
.doc.term td:first-child{color:#7f90bd;white-space:nowrap}
.doc.term .hl{color:#fff}
.doc.receipt{background:#fbfbf6;color:#23252b;font-family:var(--f-mono);font-size:12.5px;max-width:290px;margin:0 auto;border-radius:0;border-top:1px dashed #aaa;border-bottom:1px dashed #aaa}
.doc.receipt h4{margin:0 0 6px;text-align:center;font-size:14px;letter-spacing:.08em}
.doc.receipt .c{text-align:center}
.doc.receipt hr{border:0;border-top:1px dashed #888;margin:8px 0}
.doc.receipt table{width:100%;border-collapse:collapse}
.doc.receipt td{padding:1px 6px 1px 0;vertical-align:top}
.doc.receipt td:first-child{white-space:nowrap}
.doc.chat{background:#101a2c;font-family:var(--f-body);display:flex;flex-direction:column;gap:8px}
.doc.chat h4{margin:0;font-size:13px;font-weight:600;color:#cfd8ef;border-bottom:1px solid #2a385e;padding-bottom:8px}
.msg{background:#1d2a48;border-radius:10px 10px 10px 2px;padding:8px 10px;max-width:88%;font-size:14px}
.msg small{display:block;font-size:11px;color:#8fa0cc}
.msg .who{display:block;font-size:12px;font-weight:600;color:var(--marker)}
.msg .thumb{background:#2c3a60;border-radius:6px;padding:16px 10px;text-align:center;font-size:12px;color:#aab7dc;margin:6px 0}
.cipher{font-family:var(--f-mono);font-weight:600;font-size:17px;letter-spacing:.12em;color:#1c2135;line-height:1.9;word-spacing:.3em}
.scrib{float:right;border:1.5px solid #1d2a52;border-radius:50%;padding:2px 10px;transform:rotate(6deg);font-size:17px;margin-left:10px}

/* notas */
textarea{width:100%;min-height:260px;background:var(--paper);color:#1d2a52;border:0;border-radius:3px;padding:14px;font-family:var(--f-hand);font-size:17px;line-height:1.6;resize:vertical}

/* acusação */
fieldset{border:1px solid var(--line);border-radius:4px;margin:0;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--ink-2);min-width:0}
legend{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.04em;text-transform:uppercase;padding:0 6px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px;border:1px solid var(--line);border-radius:3px;background:var(--ink);font-size:15px;cursor:pointer}
.opt input{margin:3px 0 0;width:18px;height:18px;accent-color:var(--stamp)}
.opt:has(input:checked){border-color:var(--stamp);background:#2a1b2a}
.btn{background:var(--stamp);color:#fff;border:0;border-radius:3px;padding:13px 18px;font-family:var(--f-display);font-weight:900;font-size:21px;letter-spacing:.08em;text-transform:uppercase}
.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--text);font-size:16px;padding:10px 14px;font-weight:700}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.verdict{border:2px solid var(--stamp);border-radius:4px;padding:12px 14px;color:#ffd6d2;background:#2a1620;font-size:15px}
.hint{background:#2b2710;border:1px solid #6d5d18;color:#f6e9b4;border-radius:4px;padding:10px 12px;font-size:15px}
.hint b{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;display:block;color:var(--marker)}
.solved{background:var(--paper);color:var(--paper-ink);border-radius:3px;padding:18px 16px;display:flex;flex-direction:column;gap:14px;position:relative}
.solved .stamp{align-self:flex-start;font-family:var(--f-display);font-weight:900;font-size:36px;letter-spacing:.08em;color:var(--stamp);border:4px solid var(--stamp);padding:0 12px;border-radius:3px;transform:rotate(-3deg)}
.solved .stamp.help{color:#4d566f;border-color:#4d566f}
.solved h3{font-size:24px;font-weight:900}
.solved ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px;font-size:15.5px}
.solved .rank{font-family:var(--f-mono);font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:#4d566f}
.solved .rank b{color:var(--paper-ink);font-size:14px}
.solved .epi{font-size:15.5px;border-top:1.5px solid var(--paper-ink);padding-top:12px}
.solved .btn.ghost{border-color:var(--paper-ink);color:var(--paper-ink)}
@media (prefers-reduced-motion:no-preference){
  .solved .stamp{animation:thud .35s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes thud{from{transform:rotate(-3deg) scale(1.9);opacity:.2}to{transform:rotate(-3deg) scale(1);opacity:1}}
}

/* ampliação */
#modal{position:fixed;inset:0;z-index:20;background:rgba(5,8,16,.96);display:flex;flex-direction:column}
#modal[hidden]{display:none}
#modal .mbar{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
#modal .mbar h3{flex:1;font-size:18px;font-weight:700;letter-spacing:.04em;min-width:0}
#modal .mbody{flex:1;overflow:auto;padding:14px;-webkit-overflow-scrolling:touch}
#modal .inner{width:100%;margin:0 auto;max-width:900px}
#modal .inner.x2{width:210%;max-width:none}
#modal .inner .doc{font-size:15.5px}
#modal .inner.x2 .doc{font-size:22px}
#modal .inner .doc.receipt{max-width:none}
#modal .mcap{padding:10px 14px 14px;font-size:14px;color:var(--muted);border-top:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mtitle">
  <div class="mbar"><h3 id="mtitle"></h3><button class="zoom" id="mzoom" type="button">Ampliar</button><button class="zoom" id="mclose" type="button">Fechar</button></div>
  <div class="mbody"><div class="inner" id="minner"></div></div>
  <div class="mcap" id="mcap"></div>
</div>
<script>
/* =========================================================
   DESENHOS
   ========================================================= */
function portrait(p){
  const sk=p.skin, hr=p.hair, cl=p.cloth, bg=p.bg||'#c5cede';
  const capPath='M35 60 Q31 27 60 27 Q89 27 85 60 Q80 43 60 41 Q40 43 35 60Z';
  let back='', front='';
  switch(p.style){
    case 'short': front=`<path d="${capPath}" fill="${hr}"/>`; break;
    case 'side': front=`<path d="M35 60 Q31 26 62 26 Q91 28 85 58 Q77 39 52 43 Q41 47 35 60Z" fill="${hr}"/>`; break;
    case 'bun': back=`<circle cx="60" cy="22" r="11" fill="${hr}"/>`; front=`<path d="${capPath}" fill="${hr}"/>`; break;
    case 'long': back=`<path d="M31 60 Q27 24 60 24 Q93 24 89 60 L92 108 L28 108Z" fill="${hr}"/>`; front=`<path d="M35 60 Q33 30 60 29 Q87 30 85 60 Q78 42 58 42 Q42 45 35 60Z" fill="${hr}"/>`; break;
    case 'bob': back=`<path d="M31 60 Q27 24 60 24 Q93 24 89 60 L90 86 L30 86Z" fill="${hr}"/>`; front=`<path d="M35 60 Q33 30 60 29 Q87 30 85 60 Q80 41 56 43 Q41 47 35 60Z" fill="${hr}"/>`; break;
    case 'curly': front=[[40,40,9],[50,31,10],[62,28,10],[74,32,10],[82,42,9],[36,52,7],[85,53,7],[56,38,8],[68,38,8]].map(c=>`<circle cx="${c[0]}" cy="${c[1]}" r="${c[2]}" fill="${hr}"/>`).join(''); break;
    case 'bald': front=`<path d="M35 64 Q32 52 37 46 L39 64Z M85 64 Q88 52 83 46 L81 64Z" fill="${hr}"/>`; break;
  }
  const mouth = p.mouth==='smirk' ? 'M52 78 Q60 82 69 76' : p.mouth==='frown' ? 'M52 80 Q60 75 68 80' : 'M53 78 Q60 81 67 78';
  let acc='';
  if(p.beard) acc+=`<path d="M38 68 Q40 94 60 96 Q80 94 82 68 Q78 82 60 84 Q42 82 38 68Z" fill="${p.beardColor||hr}"/>`;
  if(p.goatee) acc+=`<path d="M52 82 Q60 96 68 82 Q60 86 52 82Z" fill="${p.beardColor||hr}"/>`;
  if(p.mustache) acc+=`<path d="M48 74 Q54 69 60 73 Q66 69 72 74 Q66 77 60 75 Q54 77 48 74Z" fill="${p.beardColor||hr}"/>`;
  if(p.glasses) acc+=`<g fill="none" stroke="${p.glasses}" stroke-width="2.4"><circle cx="49" cy="62" r="8"/><circle cx="71" cy="62" r="8"/><path d="M57 62h6M41 61l-6-2M79 61l6-2"/></g>`;
  if(p.earrings) acc+=`<circle cx="35" cy="72" r="3" fill="${p.earrings}"/><circle cx="85" cy="72" r="3" fill="${p.earrings}"/>`;
  if(p.clip) acc+=`<path d="M70 40l12 5" stroke="#d9dce8" stroke-width="3" stroke-linecap="round"/>`;
  if(p.cap) acc+=`<path d="M32 46 Q34 20 60 20 Q86 20 88 46Z" fill="${p.cap}"/><rect x="30" y="43" width="60" height="7" rx="2" fill="${p.capPlain?p.cap:'#0d1224'}"/>${p.capPlain?'':'<rect x="52" y="30" width="16" height="8" rx="1" fill="#d7b24a"/>'}`;
  let neckwear='';
  if(p.bowtie) neckwear=`<path d="M60 102l-12-7v14zM60 102l12-7v14z" fill="${p.bowtie}"/>`;
  if(p.pearls) neckwear=[46,51,56,60,64,69,74].map((x,i)=>`<circle cx="${x}" cy="${100+[0,3,5,6,5,3,0][i]}" r="2.3" fill="#f3efe4"/>`).join('');
  if(p.vest) neckwear+=`<path d="M30 140 L40 104 L52 100 L56 140Z M90 140 L80 104 L68 100 L64 140Z" fill="${p.vest}"/><path d="M34 126h20M66 126h20" stroke="#fff" stroke-width="3" opacity=".8"/>`;
  const shirt = p.shirt ? `<path d="M50 98 L60 114 L70 98Z" fill="${p.shirt}"/>` : '';
  return `<svg class="pic" viewBox="0 0 120 140" role="img" aria-label="Retrato de ${p.name||'suspeito'}">
  <rect width="120" height="140" fill="${bg}"/>
  <g stroke="#0f1629" stroke-opacity=".16" stroke-width="1"><path d="M0 20h120M0 44h120M0 68h120M0 92h120M0 116h120"/></g>
  ${back}
  <path d="M12 140 Q12 106 44 99 L76 99 Q108 106 108 140Z" fill="${cl}"/>
  ${shirt}

    steps:[
      '<b>A folha vazada é uma segunda impressão.</b> O rodapé diz job #215, 20:14, usuário rmeireles no PC2. Quem vazou estava na coordenação entre 20:11 e 20:19 e sabia a senha do Raul, que ficava num bilhete embaixo do teclado.',

    ],

  }

  solution:{
    who:'Bárbara Quintela, a jornalista',
    steps:[
      '<b>O túnel é um álibi coletivo, não a cena do crime.</b> No escuro o vagão D estava trancado, a chave estava no cinto do Samuca na locomotiva e Dona Olga não sentiu ninguém passar. Das 22:00 até a parada ninguém entrou. O vagão só foi aberto uma vez: das 22:47 às 22:55, para as fotos.',

  questions:[

    {id:'q2', q:'Quem foi o cúmplice?', options:[['abel','Abel Tavares'],['kelly','Kelly Nunes'],['nando','Fernando "Nando" Vidal'],['pri','Priscila "Pri" Okada'],['yuri','Yuri Bastos'],['wag','Wagner "Wag" Leal']], answer:'wag'},

    ],

/* =========================================================
   ESTADO
   ========================================================= */
const KEY='agencia-lupa-v1';
const blank=()=>({view:'home',tab:'caso',notes:{},off:{},hints:{},attempts:{},answers:{},done:{},last:{}});
let S=blank();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function loadLocal(){ try{ const d=JSON.parse(localStorage.getItem(KEY)||'null'); if(d&&typeof d==='object') S=Object.assign(blank(),d); }catch(e){} }
const byId=id=>CASES.find(c=>c.id===id);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const app=document.getElementById('app');

function rank(d){
  if(d.gaveUp) return ['Caso encerrado com ajuda','Você viu a solução antes de acertar.'];
  const t=d.attempts+d.hints;
  if(t<=1) return ['Detetive lendário','Primeira acusação, nenhuma dica.'];
  if(t<=2) return ['Investigador sênior',''];
  if(t<=4) return ['Detetive',''];
  return ['Estagiário persistente',''];
}
function pips(n){ return `<span class="pips" aria-label="Dificuldade ${n} de 3">${[1,2,3].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</span>`; }

/* =========================================================
   TELAS
   ========================================================= */
function viewHome(){
  const solvedCount=CASES.filter(c=>S.done[c.id]).length;
  return `
  <header class="hero">
    <span class="eyebrow">Porto Âmbar · arquivo de casos · ${solvedCount} de ${CASES.length} resolvidos</span>
    <h1>Agência <span>Lupa</span></h1>
    <p>Cinco casos, nenhum assassinato. Os três primeiros têm depoimentos e vão ficando mais difíceis. O quarto e o quinto são só documentos e prints de conversa, com culpado e cúmplice. Todos se resolvem só com o que está na página.</p>
  </header>
  <ul class="rules">
    <li>Leia o caso, as fichas dos suspeitos e os depoimentos.</li>
    <li>Toque em cada pista para ampliar. Os detalhes pequenos importam.</li>
    <li>Nem todo mundo que mente é culpado, e nem toda pista aponta para o crime.</li>
    <li>Quando tiver certeza, faça a acusação. Se errar, o jogo não conta o que estava certo. Dica só aparece se você pedir. Menos tentativas e menos dicas, melhor a patente.</li>
  </ul>
  <div class="files">
    ${CASES.map(c=>{ const d=S.done[c.id]; return `
    <button class="file" type="button" data-open="${c.id}">
      <span class="num">${c.num}</span>
      <span class="body">
        <span class="meta"><span>${c.crime}</span><span>${esc(c.place)}</span><span>${pips(c.level)}</span></span>
        <h2>${esc(c.title)}</h2>
        <p>${esc(c.teaser)}</p>
        <span class="meta"><span>${c.suspects.length} suspeitos</span><span>${c.clues.length} pistas</span>${d?`<span>${esc(rank(d)[0])}</span>`:''}</span>
      </span>
      ${d?`<span class="status">${d.gaveUp?'ENCERRADO':'RESOLVIDO'}</span>`:''}
    </button>`; }).join('')}
  </div>
  <div class="foot"><span>Seu progresso e suas anotações ficam salvos neste aparelho.</span><button class="linkbtn" type="button" data-reset="${S._askReset?'go':'ask'}">${S._askReset?'Toque de novo para apagar tudo':'Apagar progresso'}</button></div>`;
}

function tabCaso(c){
  return `
  <div class="story"><span class="kicker">Caso ${c.num} · ${c.crime} · ${esc(c.place)}</span>
    ${c.brief.map((p,i)=>`<p class="${i===0?'lead':''}">${p}</p>`).join('')}</div>
  ${c.email?`<article class="mail"><header><b>${esc(c.email.subject)}</b><span>De: ${esc(c.email.from)}</span><span>Para: ${esc(c.email.to)} · ${esc(c.email.date)}</span></header>${c.email.body.map(p=>`<p>${p}</p>`).join('')}<div class="att"><span>Anexos (${c.email.attach.length})</span>${c.email.attach.map(a=>`<i>${esc(a)}</i>`).join('')}</div><button class="btn ghost" type="button" data-tab="pistas">Abrir os anexos</button></article>`:''}
  <div class="box"><h3>O que já se sabe</h3><ul class="facts">${c.facts.map(f=>`<li><b>${f[0]}</b><span>${f[1]}</span></li>`).join('')}</ul></div>
  <div class="row"><button class="btn ghost" type="button" data-tab="suspeitos">Ver suspeitos</button><button class="btn ghost" type="button" data-tab="pistas">Ver pistas</button></div>`;
}
function tabSuspeitos(c){
  const off=S.off[c.id]||{};
  return `<span class="kicker">${c.peopleLabel||c.suspects.length+' suspeitos'}</span>
  ${c.suspects.map(s=>`
  <article class="sus ${off[s.id]?'off':''}">
    <div class="head">${portrait(Object.assign({name:s.name},s.pic))}
      <div><h3>${esc(s.name)}</h3><div class="role">${esc(s.role)}</div>
        <dl><div><dt>${c.fichaLabel||'Possível motivo'}</dt><dd>${s.motive}</dd></div>
        ${s.extra?Array.from({length:s.extra.length/2},(_,i)=>`<div><dt>${s.extra[i*2]}</dt><dd>${s.extra[i*2+1]}</dd></div>`).join(''):''}</dl>
      </div></div>
    ${s.statement?`<blockquote>${s.statement}</blockquote>`:''}
    <div class="act"><button class="chip" type="button" data-off="${s.id}" aria-pressed="${off[s.id]?'true':'false'}">${off[s.id]?'Voltar a suspeitar':'Descartar suspeito'}</button></div>
  </article>`).join('')}
  <span class="kicker">Testemunhas (fora de suspeita)</span>
  ${c.witnesses.map(w=>`<div class="wit"><b>${esc(w.name)}</b><small>${esc(w.role)}</small><p>${w.statement}</p></div>`).join('')}`;
}
function tabPistas(c){
  return `<span class="kicker">${c.clues.length} pistas · toque para ampliar</span>
  ${c.clues.map((k,i)=>`
  <article class="clue">
    <div class="bar"><span class="evtag">P-${i+1}</span><h3>${esc(k.title)}</h3><button class="zoom" type="button" data-zoom="${k.id}">Ampliar</button></div>
    <div class="art" data-zoom="${k.id}">${k.art()}</div>
    <p class="cap">${k.cap}</p>
  </article>`).join('')}`;
}
function tabNotas(c){
  return `<span class="kicker">Bloco de notas · salvo sozinho</span>
  <label for="notas-${c.id}" style="font-size:14px;color:var(--muted)">Anote horários, contradições e quem você já descartou.</label>
  <textarea id="notas-${c.id}" data-notes="${c.id}" placeholder="Ex.: fulano diz que estava em tal lugar às 20h, mas a pista 3 mostra...">${esc(S.notes[c.id]||'')}</textarea>`;
}
function solutionBlock(c,d){
  const r=rank(d); const idx=CASES.indexOf(c); const next=CASES[idx+1];
  return `<div class="solved">
    <span class="stamp ${d.gaveUp?'help':''}">${d.gaveUp?'Caso encerrado':'Caso resolvido'}</span>
    <p class="rank">Patente: <b>${r[0]}</b><br>${d.gaveUp?'':`${d.attempts} ${d.attempts===1?'acusação':'acusações'} · ${d.hints} ${d.hints===1?'dica':'dicas'}`}</p>
    <h3>${esc(c.solution.who)}</h3>
    <ol>${c.solution.steps.map(s=>`<li>${s}</li>`).join('')}</ol>
    <p class="epi">${c.solution.epi}</p>
    <div class="row">${next?`<button class="btn" type="button" data-open="${next.id}">Abrir caso ${next.num}</button>`:''}<button class="btn ghost" type="button" data-home="1">Voltar ao arquivo</button></div>
  </div>`;
}
function tabAcusar(c){
  const d=S.done[c.id];
  if(d) return solutionBlock(c,d);
  const ans=S.answers[c.id]||{}; const att=S.attempts[c.id]||0; const used=S.hints[c.id]||0; const last=S.last[c.id];
  const all=c.questions.every(q=>ans[q.id]);
  return `<span class="kicker">Acusação formal · ${c.questions.length} respostas</span>
  <p style="max-width:60ch">Você precisa acertar as ${c.questions.length} para a delegacia aceitar. Se qualquer uma estiver errada, a acusação é recusada, sem dizer onde está o erro nem o que estava certo.</p>
  ${last!=null?`<div class="verdict" role="status"><b>${['Não é bem isso.','Ainda não fecha.','A delegacia não comprou essa história.','Tem furo nessa teoria.','Volte às pistas, detetive.'][(att-1)%5]}</b> Acusação recusada. Tentativas até agora: ${att}.</div>`:''}
  <form data-form="${c.id}" style="display:flex;flex-direction:column;gap:14px">
  ${c.questions.map((q,qi)=>`<fieldset><legend>${qi+1}. ${esc(q.q)}</legend>
    ${q.options.map(o=>`<label class="opt" for="${c.id}-${q.id}-${o[0]}"><input type="radio" id="${c.id}-${q.id}-${o[0]}" name="${c.id}-${q.id}" value="${o[0]}" data-q="${q.id}" ${ans[q.id]===o[0]?'checked':''}><span>${esc(o[1])}</span></label>`).join('')}
  </fieldset>`).join('')}
  <button class="btn" type="submit" ${all?'':'disabled'}>Acusar</button>
  </form>
  <div class="box"><h3>Dicas (só se você quiser)</h3>
    ${used===0?'<p style="font-size:14.5px;color:var(--muted)">Nenhuma dica aparece sozinha. Cada uma que você pedir custa um ponto na patente.</p>':''}
    ${c.hints.slice(0,used).map((h,i)=>`<div class="hint"><b>Dica ${i+1}</b>${h}</div>`).join('')}
    <div class="row">${used<c.hints.length?`<button class="btn ghost" type="button" data-hint="1">Pedir dica (${used}/${c.hints.length})</button>`:''}
    ${att>=3?`<button class="btn ghost" type="button" data-giveup="${S._askGive?'go':'ask'}">${S._askGive?'Confirmar: ver a solução':'Desistir e ver a solução'}</button>`:''}</div>
  </div>`;
}
function viewCase(c){
  const tabs=[['caso','Caso'],['suspeitos','Suspeitos'],['pistas','Pistas'],['notas','Notas'],['acusar','Acusar']];
  const body={caso:tabCaso,suspeitos:tabSuspeitos,pistas:tabPistas,notas:tabNotas,acusar:tabAcusar}[S.tab](c);
  return `
  <div class="top">
    <div class="topbar"><button class="back" type="button" data-home="1">← Arquivo</button><h1>${esc(c.title)}</h1><span class="tag">${c.num} ${pips(c.level)}</span></div>
    <div class="tabs" role="tablist">${tabs.map(t=>`<button class="tab ${t[0]==='acusar'?'accuse':''}" role="tab" type="button" aria-selected="${S.tab===t[0]}" data-tab="${t[0]}">${t[1]}</button>`).join('')}</div>
  </div>
  <section class="panel" role="tabpanel">${body}</section>`;
}
function render(scrollTop){
  const c=byId(S.view);
  if(!c){ S.view='home'; }
  if(c && !['caso','suspeitos','pistas','notas','acusar'].includes(S.tab)) S.tab='caso';
  app.innerHTML = c ? viewCase(c) : viewHome();
  document.title = c ? c.title+' · Agência Lupa' : 'Agência Lupa';
  if(scrollTop) window.scrollTo(0,0);
  save();
}

/* =========================================================
   AÇÕES
   ========================================================= */
function go(view){
  S.view=view; S.tab='caso'; S._askReset=false; S._askGive=false;
  const h = view==='home' ? '' : '#'+view;
  if(location.hash!==h){ try{ if(h) location.hash=h; else history.replaceState(null,'',location.pathname+location.search); }catch(e){} }
  render(true);
}
app.addEventListener('click',e=>{
  const t=e.target.closest('[data-open],[data-home],[data-tab],[data-off],[data-zoom],[data-hint],[data-giveup],[data-reset]');
  if(!t) return;
  const c=byId(S.view);
  if(t.dataset.open){ go(t.dataset.open); return; }
  if(t.dataset.home){ go('home'); return; }
  if(t.dataset.tab){ S.tab=t.dataset.tab; S._askGive=false; render(true); return; }
  if(t.dataset.off && c){ const o=S.off[c.id]||(S.off[c.id]={}); o[t.dataset.off]=!o[t.dataset.off]; render(false); return; }
  if(t.dataset.zoom && c){ openZoom(c, t.dataset.zoom); return; }
  if(t.dataset.hint && c){ S.hints[c.id]=Math.min((S.hints[c.id]||0)+1,c.hints.length); render(false); return; }
  if(t.dataset.giveup && c){
    if(t.dataset.giveup==='ask'){ S._askGive=true; render(false); return; }
    S.done[c.id]={attempts:S.attempts[c.id]||0,hints:S.hints[c.id]||0,gaveUp:true}; S._askGive=false; render(true); return;
  }
  if(t.dataset.reset){
    if(t.dataset.reset==='ask'){ S._askReset=true; render(false); return; }
    S=blank(); render(true); return;
  }
});
app.addEventListener('change',e=>{
  const r=e.target.closest('input[type=radio][data-q]'); if(!r) return;
  const c=byId(S.view); if(!c) return;
  (S.answers[c.id]||(S.answers[c.id]={}))[r.dataset.q]=r.value; save();
  const f=r.closest('form'); const btn=f&&f.querySelector('button[type=submit]');
  if(btn) btn.disabled=!c.questions.every(q=>S.answers[c.id][q.id]);
});
app.addEventListener('input',e=>{
  const ta=e.target.closest('textarea[data-notes]'); if(!ta) return;
  S.notes[ta.dataset.notes]=ta.value; save();
});
app.addEventListener('submit',e=>{
  e.preventDefault();
  const c=byId(S.view); if(!c) return;
  const ans=S.answers[c.id]||{};
  if(!c.questions.every(q=>ans[q.id])) return;
  S.attempts[c.id]=(S.attempts[c.id]||0)+1;
  const right=c.questions.filter(q=>ans[q.id]===q.answer).length;
  if(right===c.questions.length){ S.done[c.id]={attempts:S.attempts[c.id],hints:S.hints[c.id]||0,gaveUp:false}; delete S.last[c.id]; }
  else S.last[c.id]=right;
  render(true);
});

/* ampliação */
const modal=document.getElementById('modal'), minner=document.getElementById('minner'), mzoom=document.getElementById('mzoom');
function openZoom(c,id){
  const k=c.clues.find(x=>x.id===id); if(!k) return;
  document.getElementById('mtitle').textContent='P-'+(c.clues.indexOf(k)+1)+' · '+k.title;
  minner.className='inner'; minner.innerHTML=k.art(); mzoom.textContent='Ampliar';
  document.getElementById('mcap').textContent=k.cap;
  modal.hidden=false; document.body.style.overflow='hidden'; document.getElementById('mclose').focus();
}
function closeZoom(){ modal.hidden=true; minner.innerHTML=''; document.body.style.overflow=''; }
document.getElementById('mclose').addEventListener('click',closeZoom);
mzoom.addEventListener('click',()=>{ const on=minner.classList.toggle('x2'); mzoom.textContent=on?'Reduzir':'Ampliar'; });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!modal.hidden) closeZoom(); });
window.addEventListener('hashchange',()=>{
  const id=(location.hash||'').slice(1); const v=byId(id)?id:'home';
  if(v!==S.view){ S.view=v; S.tab='caso'; render(true); }
});

function start(data){
  loadLocal();
  if(data && typeof data==='object' && data.view) S=Object.assign(blank(),data);
  const id=(location.hash||'').slice(1);
  if(byId(id)){ if(S.view!==id){ S.view=id; S.tab='caso'; } }
  else if(!byId(S.view)) S.view='home';
  if(S.c4v!==2){ ['notes','off','hints','attempts','answers','done','last'].forEach(k=>{ if(S[k]) delete S[k]['caso-4']; }); S.c4v=2; }
  S._askReset=false; S._askGive=false;
  render(false);
}
try{ window.claude?.hot?.snapshot(()=>JSON.parse(JSON.stringify(S))); }catch(e){}
if(window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
</script>
